name: Podcast transcripts

# The study app asks for a transcript by posting to your private ntfy topic
# (<NTFY_TOPIC>-transcribe). This checks for requests every 10 minutes and only
# installs the speech-to-text model when there's work to do.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast-transcripts
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DIGEST_URL: https://dbarlow2004-hub.github.io/endiatx.github.io-workspace/sustainability/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for transcript requests
        id: check
        run: python3 sustainability/transcribe.py --check

      - name: Cache speech-to-text model
        if: steps.check.outputs.work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base.en-v1

      - name: Install transcription tools
        if: steps.check.outputs.work == 'true'
        run: pip install "faster-whisper==1.2.1" cryptography

      - name: Get transcripts
        if: steps.check.outputs.work == 'true'
        run: python3 sustainability/transcribe.py

      - name: Save transcripts
        if: steps.check.outputs.work == 'true'
        run: |
          git config user.name "podcast-transcripts[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sustainability/transcripts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add podcast transcript(s)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
