<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canopy Watch</title>
<meta name="description" content="Short videos on energy, climate, buildings and the firms you want to work for, in a vertical swipe feed.">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#000;--text:#fff;--muted:rgba(255,255,255,.72);--accent:#00e5c9;--chip:rgba(255,255,255,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}

/* top tabs, like Following / For You */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:center;gap:4px;padding:calc(10px + env(safe-area-inset-top)) 56px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.top button{padding:6px 8px;font-weight:700;font-size:15px;color:var(--muted);position:relative;white-space:nowrap}
.top button[aria-pressed="true"]{color:#fff}
.top button[aria-pressed="true"]::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px;background:#fff}
.back{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;z-index:21;width:36px;height:36px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none}

/* the feed: one video per screen, swipe up */
.feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.slide{height:100dvh;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
@supports (height:100dvh){.slide{height:100dvh}}
.stage{position:relative;height:100%;width:100%;max-width:min(100%, calc(100dvh * 9 / 16));background:#111}
.stage img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.play span{width:72px;height:72px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:30px;padding-left:5px;backdrop-filter:blur(4px)}
.shade{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}

/* caption (bottom left) and action rail (right) */
.cap{position:absolute;left:14px;right:84px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:3;pointer-events:none}
.cap .who{font-weight:800;font-size:16px}
.cap .t{font-size:15px;line-height:1.35;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cap .tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;background:var(--chip);border-radius:6px;padding:3px 8px}
.rail{position:absolute;right:10px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:4;display:flex;flex-direction:column;gap:18px;align-items:center}
.rail .av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:17px;border:2px solid #fff}
.rail button,.rail a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rail .ic{font-size:30px;line-height:1;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.rail .on .ic{transform:scale(1.15)}

/* notes sheet, like the comments drawer */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;color:#111;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s}
.sheet.on{transform:none}.sheet-bg.on{display:block}
@media (min-width:700px){.sheet{left:50%;width:560px;margin-left:-280px}}
.sheet h3{font-size:15px;text-align:center;margin-bottom:10px}
.sheet textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #ddd;border-radius:12px;resize:vertical}
.sheet .row{display:flex;gap:8px;margin-top:10px}
.sheet .btn{flex:1;padding:11px;border-radius:10px;font-weight:700;border:1px solid #ddd}
.sheet .btn.primary{background:#111;color:#fff;border-color:#111}
.sheet .note{font-size:12.5px;color:#666;margin-top:8px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;background:rgba(255,255,255,.95);color:#111;font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px;display:none}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--muted)}
.hint{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;font-size:13px;color:var(--muted);animation:bob 1.6s infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
@media (prefers-reduced-motion: reduce){.hint{animation:none}.sheet{transition:none}}
</style>
</head>
<body>
<a class="back" href="learn.html" aria-label="Back to Canopy">‹</a>
<nav class="top" aria-label="Feeds">
  <button data-f="all" aria-pressed="true">For You</button>
  <button data-f="company" aria-pressed="false">Companies</button>
  <button data-f="explainer" aria-pressed="false">Explainers</button>
</nav>
<main class="feed" id="feed"></main>
<div class="hint" id="hint">Swipe up ↑</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle">Notes</h3>
  <textarea id="noteText" placeholder="What did you learn? Numbers, ideas, questions..."></textarea>
  <div class="row"><button class="btn" id="noteCancel">Cancel</button><button class="btn primary" id="noteSave">Save to Library</button></div>
  <p class="note">Saved notes appear with this video in your Canopy Library.</p>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okId = id => /^[A-Za-z0-9_-]{11}$/.test(id);
const LIKES = "canopy-video-likes", INBOX = "energybrief-inbox";
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let all = [], filter = "all", interacted = false;
const likes = new Set(store.get(LIKES, []));

function toast(t){ const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 1600); }
// Saving and notes go through the same inbox the news page uses; the Library picks them up.
function toLibrary(v, extra){
  const box = store.get(INBOX, []);
  box.push({title:v.title || `${v.channel} short`, link:`https://www.youtube.com/shorts/${v.id}`, source:v.channel, type:"video", status:"done", ...extra});
  store.set(INBOX, box);
}

function render(){
  const list = all.filter(v => filter === "all" || v.kind === filter);
  const feed = $("#feed");
  if (!list.length) { feed.innerHTML = `<div class="empty"><div style="font-size:42px">📺</div><b>No videos yet</b><span>The feed refreshes every morning.</span><a href="learn.html" style="color:var(--accent)">Back to Canopy</a></div>`; return; }
  feed.innerHTML = list.map((v, i) => `
    <section class="slide" data-i="${i}" data-id="${esc(v.id)}">
      <div class="stage">
        <img class="poster" src="https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg" alt="" loading="${i < 2 ? "eager" : "lazy"}">
        <button class="play" aria-label="Play ${esc(v.title)}"><span>▶</span></button>
        <div class="shade"></div>
        <div class="cap"><div class="who">@${esc(v.channel)}</div><div class="t">${esc(v.title)}</div><span class="tag">${v.kind === "company" ? "🏢 Company" : "💡 Explainer"}</span></div>
        <div class="rail">
          <div class="av" aria-hidden="true">${esc((v.channel || "?")[0])}</div>
          <button data-like class="${likes.has(v.id) ? "on" : ""}" aria-label="Save to Library"><span class="ic">${likes.has(v.id) ? "💚" : "🤍"}</span>${likes.has(v.id) ? "Saved" : "Save"}</button>
          <button data-notes aria-label="Take notes"><span class="ic">📝</span>Notes</button>
          <a href="https://www.youtube.com/shorts/${esc(v.id)}" target="_blank" rel="noopener" aria-label="Open on YouTube"><span class="ic">↗</span>YouTube</a>
        </div>
      </div>
    </section>`).join("");
  feed.scrollTop = 0;
}
function play(slide){
  const id = slide.dataset.id; if (!okId(id) || slide.querySelector("iframe")) return;
  const f = document.createElement("iframe");
  f.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&loop=1&playlist=${id}&rel=0&modestbranding=1`;
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true; f.title = "Video";
  slide.querySelector(".stage").prepend(f);
  slide.querySelector(".play").hidden = true; slide.querySelector(".poster").hidden = true;
}
function stop(slide){
  slide.querySelector("iframe")?.remove();
  const p = slide.querySelector(".play"), img = slide.querySelector(".poster"); if (p) p.hidden = false; if (img) img.hidden = false;
}
// Only the video on screen plays. After your first tap, the next ones start as you swipe to them.
const io = new IntersectionObserver(entries => entries.forEach(e => {
  if (e.isIntersecting && e.intersectionRatio > .7) { if (interacted) play(e.target); }
  else stop(e.target);
}), {threshold:[0, .7, 1]});

$("#feed").addEventListener("click", e => {
  const slide = e.target.closest(".slide"); if (!slide) return;
  const v = all.find(x => x.id === slide.dataset.id);
  if (e.target.closest("[data-like]")) {
    const b = e.target.closest("[data-like]");
    if (likes.has(v.id)) { likes.delete(v.id); toast("Removed"); }
    else { likes.add(v.id); toLibrary(v); toast("💚 Saved to your Library"); }
    store.set(LIKES, [...likes]);
    b.classList.toggle("on", likes.has(v.id)); b.innerHTML = `<span class="ic">${likes.has(v.id) ? "💚" : "🤍"}</span>${likes.has(v.id) ? "Saved" : "Save"}`;
    return;
  }
  if (e.target.closest("[data-notes]")) { openNotes(v); return; }
  if (e.target.closest(".play")) { interacted = true; $("#hint").hidden = true; play(slide); }
});
let noteFor = null;
function openNotes(v){ noteFor = v; $("#noteText").value = ""; $("#sheetTitle").textContent = `Notes · ${v.title}`; $("#sheet").classList.add("on"); $("#sheetBg").classList.add("on"); setTimeout(() => $("#noteText").focus(), 200); }
function closeNotes(){ $("#sheet").classList.remove("on"); $("#sheetBg").classList.remove("on"); }
$("#sheetBg").onclick = closeNotes; $("#noteCancel").onclick = closeNotes;
$("#noteSave").onclick = () => {
  const t = $("#noteText").value.trim(); if (!t) { $("#noteText").focus(); return; }
  toLibrary(noteFor, {notes:t}); likes.add(noteFor.id); store.set(LIKES, [...likes]);
  closeNotes(); toast("📝 Notes saved to your Library"); render();
};
document.querySelectorAll(".top [data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".top [data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); observe();
});
function observe(){ io.disconnect(); document.querySelectorAll(".slide").forEach(s => io.observe(s)); }
$("#feed").addEventListener("scroll", () => { if ($("#feed").scrollTop > 40) $("#hint").hidden = true; }, {passive:true});

fetch("videos.json", {cache:"no-cache"}).then(r => r.ok ? r.json() : {videos:[]}).catch(() => ({videos:[]})).then(d => {
  // shuffle so the feed feels fresh, but keep the company clips spread through it
  all = (d.videos || []).filter(v => okId(v.id));
  for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
  const start = new URLSearchParams(location.search).get("f");
  if (["company","explainer"].includes(start)) document.querySelector(`.top [data-f="${start}"]`).click(); else { render(); observe(); }
});
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
